name: Django CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hfdn_health
          POSTGRES_USER: hfdn_app
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hfdn_app -d hfdn_health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-only-secret-not-for-production-use-0123456789-abcdefghijklmnopqrstuvwxyz"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,healthcheck.railway.app,testserver"
      DATABASE_URL: "postgresql://hfdn_app:ci-test-password@127.0.0.1:5432/hfdn_health"
      SECURE_SSL_REDIRECT: "False"
      MEDIA_ROOT: "/tmp/hfdn-test-media"
      LOG_LEVEL: "WARNING"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migration files are current
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run automated tests
        run: python manage.py test --verbosity 2
