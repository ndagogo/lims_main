<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied | {{ org_short_name|default:"LIMS" }}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; background: #f4f1ea; color: #1c1917; padding: 1.5rem; }
    .panel { max-width: 26rem; width: 100%; background: #fff; border: 1px solid #e7e2d9; border-radius: 1.25rem; padding: 2rem 1.75rem; text-align: center; }
    .warn { width: 4rem; height: 4rem; margin: 0 auto 1rem; border-radius: 999px; display: grid; place-items: center; background: #fef2f2; color: #b91c1c; font-size: 2rem; font-weight: 700; border: 2px solid #fecaca; }
    h1 { font-size: 1.35rem; margin: 0 0 .6rem; }
    p { margin: 0; color: #57534e; line-height: 1.5; }
    a.btn { display: inline-block; margin-top: 1rem; padding: .65rem 1.2rem; border-radius: 999px; background: #171717; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="panel" role="alert">
    <div class="warn" aria-hidden="true">!</div>
    <h1>Access denied</h1>
    <p>You do not have permission to open this page. Ask a platform administrator if you need access.</p>
    <a class="btn" href="/">Return home</a>
  </div>
</body>
</html>
