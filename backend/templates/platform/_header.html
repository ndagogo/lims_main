<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
  <div>
    <div class="muted small"><a class="text-decoration-none muted" href="{% url 'platform-hub' %}">Platform controls</a> · {{ section_label|upper }}</div>
    <h1 class="h3 mb-1">{{ title }}</h1>
    {% if subtitle %}<p class="muted mb-0">{{ subtitle }}</p>{% endif %}
  </div>
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'platform-hub' %}">Back to platform controls</a>
</div>
<div class="alert alert-warning py-2 small">Restricted configuration area. Changes affect the whole platform and are audited.</div>
