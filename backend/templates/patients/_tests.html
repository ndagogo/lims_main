<div class="col-12 test-picker">
  <input type="hidden" name="tariff" class="tariff-select" value="">
  <div class="tariff-hint d-none" aria-hidden="true"></div>
  <div class="row g-3 align-items-end">
    <div class="col-md-4">
      <label class="form-label">Request type</label>
      <select class="form-select request-type" title="Does not limit search — puts this catalogue first in the match list">
        <option value="laboratory">Laboratory</option>
        <option value="radiology">Radiology</option>
      </select>
    </div>
    <div class="col-md-8">
      <label class="form-label">Search tests</label>
      <input class="form-control test-search" placeholder="Search laboratory or radiology — e.g. CBC, chest, X-ray" autocomplete="off">
    </div>
    <div class="col-md-8">
      <label class="form-label">Matching tests</label>
      <select class="form-select test-results" size="6"></select>
    </div>
    <div class="col-md-4">
      <button class="btn btn-outline-dark test-add" type="button">Add test</button>
    </div>
  </div>
  <div class="mt-3">
    <div class="fw-semibold mb-2">Added tests</div>
    <p class="test-note small text-warning mb-2"></p>
    <ul class="list-group test-added"></ul>
    <p class="muted test-empty mb-0">No tests added yet.</p>
  </div>
</div>
