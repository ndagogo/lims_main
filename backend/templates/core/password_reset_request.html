{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
  <h1 class="h4 mb-3">Reset password</h1>
  <p class="text-muted">Enter your staff email. We will send a reset link if an account exists.</p>
  <form method="post">{% csrf_token %}
    <label class="form-label">Email<input type="email" name="email" class="form-control" required></label>
    <button class="btn btn-primary mt-3 w-100">Send reset link</button>
  </form>
  <p class="mt-3"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
