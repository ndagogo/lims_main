<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | HFDN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 28rem">
  <h1 class="h3 mb-3">HFDN Health</h1>
  <p class="text-secondary">Sign in with your staff account. Access stays limited to the centres you are granted.</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post" class="card p-4 border-0 shadow-sm">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
