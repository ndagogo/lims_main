{% extends "base.html" %}
{% block title %}Set new password{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
  <h1 class="h4 mb-3">Set a new password</h1>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post">{% csrf_token %}
    <label class="form-label">New password (min 12 characters)
      <input type="password" name="password" class="form-control" minlength="12" required>
    </label>
    <button class="btn btn-primary mt-3 w-100">Update password</button>
  </form>
</div>
{% endblock %}
