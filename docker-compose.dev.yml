services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hfdn_health
      POSTGRES_USER: hfdn_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hfdn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfdn_app -d hfdn_health"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
  web:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://hfdn_app:${POSTGRES_PASSWORD:-local-dev-change-me}@db:5432/hfdn_health
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build: ./backend
    env_file: ./backend/.env
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgresql://hfdn_app:${POSTGRES_PASSWORD:-local-dev-change-me}@db:5432/hfdn_health
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  hfdn_pgdata:
